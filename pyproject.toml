[project]
name = "oemof.eesyplan"
description = "SHORT DESCRIPTION"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Open Plan Community and oemof developer group", email = "contact@oemof.org" },
]
keywords = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Utilities",
]
dependencies = [
  "oemof-datapackage",
  "oemof-network",
  "oemof-solph",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://oemof-eesyplan.readthedocs.io/en/latest/changelog.html"
Documentation = "https://oemof-eesyplan.readthedocs.io/"
Homepage = "https://github.com/oemof/oemof-eesyplan"
"Issue Tracker" = "https://github.com/oemof/oemof-eesyplan/issues/"

[project.scripts]
solve_dp = "oemof.eesyplan.datapackage.energy_system:cli"

[project.optional-dependencies]
docs = ["sphinx", "sphinx_rtd_theme"]
dummy = ["oemof"]
examples = []
importer = ["pyproj", "oemof-demand"]
test = [
  "pytest",
  "tespy",
  "coverage",
  "pvlib",
  "oemof-demand",
  "tox",
  "oemof-visio",
  "pyproj",
  "mip",
  "mock"
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.black]
line-length = 79
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | ci
)/
'''

[tool.flit.sdist]
include = [
  ".coveragerc",
  ".editorconfig",
  ".readthedocs.yml",
  ".pre-commit-config.yaml",
  "tox.ini",
  "AUTHORS.rst",
  "CHANGELOG.rst",
  "CONTRIBUTING.rst",
  "LICENSE",
  "README.rst",
  "examples/",
  "docs/",
  "src/",
  "tests/",
  ".bumpversion.cfg",
  ".cookiecutterrc",
  ".taplo.toml",
  "MANIFEST.in",
  "ci/bootstrap.py",
  "ci/requirements.txt",
  "ci/templates/.github/workflows/github-actions.yml",
  "pytest.ini",
  "tests/test_data/TRY2015_39065002972500_Jahr.dat",
]
exclude = ["docs/_build", "**/*.egg-info"]

[tool.flit.module]
name = "oemof.eesyplan"

[tool.ruff]
extend-exclude = ["static", "ci/templates"]
line-length = 79
src = ["src", "tests", "examples"]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "RUF001",
  "S101",
  "S308",
  "S603",
  "S607",
  "E501",
]
select = [
  "B",
  "C4",
  "DTZ",
  "E",
  "EXE",
  "F",
  "I",
  "INT",
  "PIE",
  "PLC",
  "PLE",
  "PT",
  "PTH",
  "RSE",
  "RUF",
  "S",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"ci/*" = ["S"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
forced-separate = ["conftest"]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
